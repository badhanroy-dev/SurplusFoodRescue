<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Volunteer</title>
    <link rel="stylesheet" href="css/edit_volunteer.css">
</head>
<body>

<div class="page">
   <div class="header">
            <div>
                <h1>Edit Volunteer Information</h1>
             <p>Update the volunteer's information below with new information below:</p>
            </div>
           <a href="volunteer_verify.html" class="back-button">Back</a>
        </div>
         <div class="form-card">
    <form>
        <label>Volunteer Name</label>
        <input type="text" placeholder="Name">

        <label>Phone Number</label>
        <input type="text" placeholder="Phone Number">

        <label>Email</label>
        <input type="email" placeholder="Email">

        <label>Address</label>
        <input type="text" placeholder="Address">

        <label for="nid">NID Number</label>
        <input type="text" placeholder="NID">

               <div class="actions">
                    <button type="submit" class="add-btn">Save Changes</button>
                </div>
    </form>
    </div>
    </div>


</body>
</html>
