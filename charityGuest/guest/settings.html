<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Settings</title>

    <link rel="stylesheet" href="settings.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <div class="settings-page">


        <!-- =========================================
             HEADER
        ========================================= -->

        <header class="settings-header">

            <a href="home.html" class="logo">

                <div class="logo-icon">

                    <i class="fa-solid fa-hand-holding-heart"></i>

                </div>

                <div>

                    <h2>FoodRescue</h2>

                    <p>Rescue. Share. Serve.</p>

                </div>

            </a>


            <a href="home.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </header>



        <!-- =========================================
             MAIN
        ========================================= -->

        <main class="settings-main">


            <div class="settings-card">


                <!-- CARD HEADER -->

                <div class="settings-card-header">

                    <div class="settings-icon">

                        <i class="fa-solid fa-gear"></i>

                    </div>

                    <h1>Account Settings</h1>

                    <p>
                        Manage your FoodRescue account information
                        and preferences.
                    </p>

                </div>



                <!-- SETTINGS FORM -->

                <form action="settings_process.php" method="POST" id="settingsForm">


                    <!-- PROFILE SECTION -->

                    <div class="settings-section">

                        <div class="section-title">

                            <i class="fa-solid fa-user"></i>

                            <h2>Profile Information</h2>

                        </div>


                        <div class="form-grid">


                            <div class="form-group">

                                <label>Organization / Full Name</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-user"></i>

                                    <input type="text" name="full_name" id="full_name"
                                        placeholder="Enter name" required>

                                </div>

                            </div>


                            <div class="form-group">

                                <label>Registration / NID Number</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-id-card"></i>

                                    <input type="text" name="reg_nid_number" id="reg_nid_number"
                                        placeholder="Enter number" disabled>

                                </div>

                            </div>


                        </div>


                        <div class="form-grid">


                            <div class="form-group">

                                <label>Email Address</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-envelope"></i>

                                    <input type="email" name="email" id="email"
                                        placeholder="Enter email address" disabled>

                                </div>

                            </div>


                            <div class="form-group">

                                <label>Phone Number</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-phone"></i>

                                    <input type="tel" name="phone" id="phone"
                                        placeholder="+880 1XXXXXXXXX" required>

                                </div>

                            </div>


                        </div>


                        <div class="form-group">

                            <label>Address / Pickup Area</label>

                            <div class="input-box">

                                <i class="fa-solid fa-location-dot"></i>

                                <input type="text" name="address" id="address"
                                    placeholder="Enter your location" required>

                            </div>

                        </div>


                    </div>



                    <!-- ACCOUNT SECTION -->

                    <div class="settings-section">

                        <div class="section-title">

                            <i class="fa-solid fa-sliders"></i>

                            <h2>Account Preferences</h2>

                        </div>


                        <div class="form-grid">


                            <div class="form-group">

                                <label>Account Type</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-users"></i>

                                    <select name="role" id="role" disabled>

                                        <option value="">Select account type</option>

                                        <option value="Food Donor">Food Donor</option>

                                        <option value="Charity Organization">Charity Organization</option>

                                        <option value="Volunteer Rider">Volunteer Rider</option>

                                    </select>

                                </div>

                            </div>


                        </div>


                    </div>



                    <!-- PASSWORD SECTION -->

                    <div class="settings-section">

                        <div class="section-title">

                            <i class="fa-solid fa-lock"></i>

                            <h2>Change Password</h2>

                        </div>


                        <div class="form-group">

                            <label>Current Password</label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password" name="current_password" id="current_password"
                                    placeholder="Current password" required>

                            </div>

                        </div>


                        <div class="form-grid">


                            <div class="form-group">

                                <label>New Password</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-lock"></i>

                                    <input type="password" name="new_password" id="new_password"
                                        placeholder="New password" required>

                                </div>

                            </div>


                            <div class="form-group">

                                <label>Confirm Password</label>

                                <div class="input-box">

                                    <i class="fa-solid fa-lock"></i>

                                    <input type="password" name="confirm_password" id="confirm_password"
                                        placeholder="Confirm password" required>

                                </div>

                            </div>


                        </div>


                    </div>



                    <!-- SAVE BUTTON -->

                    <button type="submit" class="settings-button">

                        Save Changes

                        <i class="fa-solid fa-check"></i>

                    </button>


                </form>



                <!-- FOOTER -->

                <div class="settings-footer">

                    <p>

                        Need help?

                        <a href="#">Contact Support</a>

                    </p>

                </div>


            </div>


        </main>



        <!-- FOOTER -->

        <footer class="settings-bottom">

            <p>
                2026 FoodRescue. All rights reserved.
            </p>

        </footer>


    </div>


</body>

</html>
