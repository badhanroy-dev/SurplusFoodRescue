
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Settings</title>

    <link rel="stylesheet" href="settings.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <div class="settings-page">


        <!-- =========================================
             HEADER
        ========================================= -->

        <header class="settings-header">

            <a href="home.html" class="logo">

                <div class="logo-icon">

                    <i class="fa-solid fa-hand-holding-heart"></i>

                </div>

                <div>

                    <h2>FoodRescue</h2>

                    <p>Rescue. Share. Serve.</p>

                </div>

            </a>


            <a href="home.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </header>



        <!-- =========================================
             MAIN
        ========================================= -->

        <main class="settings-main">


            <div class="settings-card">


                <!-- CARD HEADER -->

                <div class="settings-card-header">

                    <div class="settings-icon">

                        <i class="fa-solid fa-gear"></i>

                    </div>

                    <h1>Account Settings</h1>

                    <p>
                        Manage your FoodRescue account information
                        and preferences.
                    </p>

                </div>



                <!-- PROFILE SECTION -->

                <div class="settings-section">

                    <div class="section-title">

                        <i class="fa-solid fa-user"></i>

                        <h2>Profile Information</h2>

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label>Full Name</label>

                            <div class="input-box">

                                <i class="fa-solid fa-user"></i>

                                <input type="text"
                                    placeholder="Enter your name">

                            </div>

                        </div>


                        <div class="form-group">

                            <label>Email Address</label>

                            <div class="input-box">

                                <i class="fa-solid fa-envelope"></i>

                                <input type="email"
                                    placeholder="Enter your email">

                            </div>

                        </div>


                    </div>



                    <div class="form-group">

                        <label>Phone Number</label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input type="tel"
                                placeholder="+880 1XXXXXXXXX">

                        </div>

                    </div>


                    <div class="form-group">

                        <label>Address / Pickup Area</label>

                        <div class="input-box">

                            <i class="fa-solid fa-location-dot"></i>

                            <input type="text"
                                placeholder="Enter your location">

                        </div>

                    </div>


                </div>



                <!-- ACCOUNT SECTION -->

                <div class="settings-section">

                    <div class="section-title">

                        <i class="fa-solid fa-sliders"></i>

                        <h2>Account Preferences</h2>

                    </div>


                    <div class="form-group">

                        <label>Account Type</label>

                        <div class="input-box">

                            <i class="fa-solid fa-users"></i>

                            <select>

                                <option>Food Donor</option>

                                <option>Charity Organization</option>

                                <option>Volunteer Rider</option>

                            </select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>Notification Preference</label>

                        <div class="input-box">

                            <i class="fa-solid fa-bell"></i>

                            <select>

                                <option>Email Notifications</option>

                                <option>SMS Notifications</option>

                                <option>Email and SMS</option>

                                <option>No Notifications</option>

                            </select>

                        </div>

                    </div>


                </div>



                <!-- PASSWORD SECTION -->

                <div class="settings-section">

                    <div class="section-title">

                        <i class="fa-solid fa-lock"></i>

                        <h2>Change Password</h2>

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label>Current Password</label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password"
                                    placeholder="Current password">

                            </div>

                        </div>


                        <div class="form-group">

                            <label>New Password</label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password"
                                    placeholder="New password">

                            </div>

                        </div>


                    </div>


                </div>



                <!-- SAVE BUTTON -->

                <button type="button" class="settings-button">

                    Save Changes

                    <i class="fa-solid fa-check"></i>

                </button>



                <!-- FOOTER -->

                <div class="settings-footer">

                    <p>

                        Need help?

                        <a href="#">Contact Support</a>

                    </p>

                </div>


            </div>


        </main>



        <!-- FOOTER -->

        <footer class="settings-bottom">

            <p>
                2026 FoodRescue. All rights reserved.
            </p>

        </footer>


    </div>


</body>

</html>
