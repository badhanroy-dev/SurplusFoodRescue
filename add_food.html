<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food</title>
    <link rel="stylesheet" href="css/addfood.css">
</head>
<body>

    <div class="page">
        <div class="header">
            <div>
                <h1>Add Food</h1>
                <p>Add a new food category and safety information:</p>
            </div>
            <a href="foodcategories.html" class="back-btn">Back</a>
        </div>
        <div class="form-card">
            <form>
                <div class="form-group">
                    <label>Food Name</label>
                    <input type="text" placeholder="Enter food name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select required>
                            <option value="">Select category</option>
                            <option>Cooked Meals</option>
                            <option>Bakery</option>
                            <option>Fruits & Vegetables</option>
                            <option>Dairy</option>
                            <option>Packaged Food</option>
                            <option>Beverages</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" placeholder="e.g. 20" min="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry">Expiry Date</label>
                        <input type="date" id="expiry" required>
                    </div>
                    <div class="form-group">
                        <label>Food Condition</label>
                        <select required>
                            <option value="">Select condition</option>
                            <option>Fresh</option>
                            <option>Good</option>
                            <option>Near Expiry</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Food Safety Information</label>
                    <textarea rows="4" placeholder="Enter storage instructions,allergens,or safety notes..."></textarea>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea rows="3" placeholder="Brief description of the food..."></textarea>
                </div>
                <div class="actions">
                    <button type="reset" class="cancel-btn">Cancel</button>
                    <button type="submit" class="add-btn">+ Add Food</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
