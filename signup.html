<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Sign Up</title>

    <link rel="stylesheet" href="signup.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <div class="auth-page">


        <!-- =========================================
             HEADER
        ========================================= -->

        <header class="auth-header">

            <a href="home.html" class="logo">

                <div class="logo-icon">

                    <i class="fa-solid fa-hand-holding-heart"></i>

                </div>

                <div>

                    <h2>FoodRescue</h2>

                    <p>Rescue. Share. Serve.</p>

                </div>

            </a>


            <a href="home.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </header>



        <!-- =========================================
             MAIN
        ========================================= -->

        <main class="auth-main">


            <div class="auth-card">


                <!-- CARD HEADER -->

                <div class="auth-card-header">

                    <div class="auth-icon">

                        <i class="fa-solid fa-user-plus"></i>

                    </div>

                    <h1>Create Your Account</h1>

                    <p>
                        Join FoodRescue and help turn surplus
                        food into community impact.
                    </p>

                </div>



                <!-- SIGNUP FORM -->

                <form>


                    <!-- ACCOUNT TYPE -->

                    <div class="form-group">

                        <label>Account Type</label>

                        <div class="input-box">

                            <i class="fa-solid fa-users"></i>

                            <select>

                                <option>Select account type</option>

                                <option>Food Donor</option>

                                <option>Charity Organization</option>

                                <option>Volunteer Rider</option>

                            </select>

                        </div>

                    </div>



                    <!-- NAME -->

                    <div class="form-grid">


                        <div class="form-group">

                            <label>Organization / Full Name</label>

                            <div class="input-box">

                                <i class="fa-solid fa-user"></i>

                                <input type="text"
                                    placeholder="Enter name">

                            </div>

                        </div>


                        <div class="form-group">

                            <label>Registration / NID Number</label>

                            <div class="input-box">

                                <i class="fa-solid fa-id-card"></i>

                                <input type="text"
                                    placeholder="Enter number">

                            </div>

                        </div>


                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label>Email Address</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input type="email"
                                placeholder="Enter email address">

                        </div>

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label>Phone Number</label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input type="tel"
                                placeholder="+880 1XXXXXXXXX">

                        </div>

                    </div>



                    <!-- LOCATION -->

                    <div class="form-group">

                        <label>Address / Pickup Area</label>

                        <div class="input-box">

                            <i class="fa-solid fa-location-dot"></i>

                            <input type="text"
                                placeholder="Enter your location">

                        </div>

                    </div>



                    <!-- PASSWORD GRID -->

                    <div class="form-grid">


                        <div class="form-group">

                            <label>Password</label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password"
                                    placeholder="Create password">

                            </div>

                        </div>


                        <div class="form-group">

                            <label>Confirm Password</label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input type="password"
                                    placeholder="Confirm password">

                            </div>

                        </div>


                    </div>



                    <!-- TERMS -->

                    <div class="terms">

                        <input type="checkbox">

                        <p>
                            I agree to the FoodRescue
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </p>

                    </div>



                    <!-- BUTTON -->

                    <button type="submit" class="auth-button">

                        Create Account

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                </form>



                <!-- LOGIN -->

                <div class="auth-footer">

                    <p>
                        Already have an account?
                        <a href="login.html">Log in</a>
                    </p>

                </div>


            </div>


        </main>



        <!-- FOOTER -->

        <footer class="auth-bottom">

            <p>
                 2026 FoodRescue. All rights reserved.
            </p>

        </footer>


    </div>


</body>

</html>
