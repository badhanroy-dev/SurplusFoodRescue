<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Forgot Password</title>

    <link rel="stylesheet" href="forgot-password.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <div class="auth-page">


        <!-- =========================================
             HEADER
        ========================================= -->

        <header class="auth-header">

            <a href="home.html" class="logo">

                <div class="logo-icon">

                    <i class="fa-solid fa-hand-holding-heart"></i>

                </div>

                <div>

                    <h2>FoodRescue</h2>

                    <p>Rescue. Share. Serve.</p>

                </div>

            </a>


            <a href="login.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </header>



        <!-- =========================================
             MAIN
        ========================================= -->

        <main class="auth-main">


            <div class="auth-card">


                <!-- CARD HEADER -->

                <div class="auth-card-header">

                    <div class="auth-icon">

                        <i class="fa-solid fa-key"></i>

                    </div>

                    <h1>Forgot Your Password?</h1>

                    <p>
                        Enter your registered email address
                        and we'll help you recover your account.
                    </p>

                </div>



                <!-- FORM -->

                <form>


                    <div class="form-group">

                        <label>Email Address or Phone Number</label>

                        <div class="input-box">

                           <i class="fa-solid fa-user"></i>

                            <input type="text"
                                placeholder="Enter your registered email or phone number">

                        </div>

                    </div>



                    <button type="submit" class="auth-button">

                        Send Reset Link

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>


                </form>



                <!-- LOGIN -->

                <div class="auth-footer">

                    <p>

                        Remember your password?

                        <a href="login.html">
                            Back to Login
                        </a>

                    </p>

                </div>


            </div>


        </main>



        <!-- FOOTER -->

        <footer class="auth-bottom">

            <p>
                 2026 FoodRescue. All rights reserved.
            </p>

        </footer>


    </div>


</body>

</html>
